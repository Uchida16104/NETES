<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NETES Dashboard</title>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">

  <h1 class="text-3xl font-bold mb-6">NETES Dashboard</h1>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

    <!-- Python Output -->
    <div class="bg-white shadow rounded p-4 overflow-auto h-96">
      <h2 class="text-xl font-semibold mb-2">Python Output</h2>
      <button 
        class="bg-blue-500 text-white px-4 py-2 rounded mb-2"
        hx-get="/api/python"
        hx-target="#python-output"
        hx-swap="innerHTML">
        Run Python
      </button>
      <pre id="python-output" class="whitespace-pre-wrap text-sm"></pre>
    </div>

    <!-- Rust Output -->
    <div class="bg-white shadow rounded p-4 overflow-auto h-96">
      <h2 class="text-xl font-semibold mb-2">Rust Output</h2>
      <button 
        class="bg-green-500 text-white px-4 py-2 rounded mb-2"
        hx-get="/api/rust"
        hx-target="#rust-output"
        hx-swap="innerHTML">
        Run Rust
      </button>
      <pre id="rust-output" class="whitespace-pre-wrap text-sm"></pre>
    </div>

    <!-- Java Output -->
    <div class="bg-white shadow rounded p-4 overflow-auto h-96 col-span-2">
      <h2 class="text-xl font-semibold mb-2">Java Output</h2>
      <button 
        class="bg-yellow-500 text-white px-4 py-2 rounded mb-2"
        hx-get="/api/java"
        hx-target="#java-output"
        hx-swap="innerHTML">
        Run Java
      </button>
      <pre id="java-output" class="whitespace-pre-wrap text-sm"></pre>
    </div>

  </div>

</body>
</html>
